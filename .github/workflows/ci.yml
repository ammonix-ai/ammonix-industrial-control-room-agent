name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements.txt pytest ruff
      - name: Ruff
        run: python -m ruff check --select E,F,B,I --line-length 100 ui scripts tests
      - name: Pytest
        run: python -m pytest tests -q
